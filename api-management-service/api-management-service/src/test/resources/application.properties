spring.application.name=api-management-service

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=jdbc:h2:mem:gatekeeper_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway builds the schema on H2; Hibernate schema validation is skipped
# because the schema uses MySQL-specific column types (e.g. LONGTEXT).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=Z2F0ZWtlZXBlci10ZXN0LXNlY3JldC0wMTIzNDU2Nzg5YWI=

gateway.kafka.configuration-topic=gateway-configuration-events
gateway.kafka.access-topic=gateway-access-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=gatekeeper-usage-billing-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false

gatekeeper.routes.allow-private-targets=true

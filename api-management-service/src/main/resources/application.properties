spring.application.name=api-management-service

server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gatekeeper_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA and Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

# JWT Configuration
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.secret=${JWT_SECRET}

# Kafka Configuration
gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.access-topic=${GATEKEEPER_ACCESS_TOPIC:gateway-access-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}

# Usage Event Consumer
spring.kafka.consumer.group-id=gatekeeper-usage-billing
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Development configuration
gatekeeper.routes.allow-private-targets=true

# Redis Configuration for Login Rate Limiting
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Billing month zone - MUST be identical in gateway and api-management-service
gatekeeper.billing.zone=${GATEKEEPER_BILLING_ZONE:UTC}

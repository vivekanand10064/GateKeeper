spring.application.name=analytics-service
info.app.name=Analytics Service
info.app.description=Access-event storage and API usage analytics

spring.data.mongodb.uri=mongodb://localhost:27017/gatekeeper_analytics_test

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=gatekeeper-analytics-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
gateway.kafka.access-topic=gateway-access-events


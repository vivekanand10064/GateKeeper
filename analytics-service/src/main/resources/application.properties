spring.application.name=analytics-service

server.port=8082

info.app.name=Analytics Service

info.app.description=Access-event storage and API usage analytics

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/gatekeeper_analytics

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=gatekeeper-analytics
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
gateway.kafka.access-topic=gateway-access-events
security.jwt.secret=${GATEKEEPER_JWT_SECRET}


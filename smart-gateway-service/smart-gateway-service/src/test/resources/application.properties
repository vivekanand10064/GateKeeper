spring.application.name=smart-gateway-service
info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

management.api.username=test-gateway
management.api.password=test-password
management.api.base-url=http://localhost:1

gateway.kafka.configuration-topic=gateway-configuration-events
gateway.kafka.access-topic=gateway-access-events
gateway.kafka.configuration-group=smart-gateway-configuration-test

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false

gatekeeper.routes.allow-private-targets=false
gatekeeper.proxy.max-request-size=10485760
gatekeeper.proxy.max-response-size=10485760

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.application.name=smart-gateway-service

server.port=8080

info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

# API Management connection
management.api.username=${GATEKEEPER_GATEWAY_USERNAME}
management.api.password=${GATEKEEPER_GATEWAY_PASSWORD}
management.api.base-url=${GATEKEEPER_MANAGEMENT_URL:http://localhost:8081}

# Kafka configuration
gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.access-topic=gateway-access-events
gateway.kafka.configuration-group=${GATEKEEPER_CONFIGURATION_GROUP:smart-gateway-configuration}

spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Backend destination security
gatekeeper.routes.allow-private-targets=${GATEKEEPER_ALLOW_PRIVATE_TARGETS:false}

# Proxy request and response limits (10 MB)
gatekeeper.proxy.max-request-size=${GATEKEEPER_MAX_REQUEST_SIZE:10485760}
gatekeeper.proxy.max-response-size=${GATEKEEPER_MAX_RESPONSE_SIZE:10485760}

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# JWT Authentication
security.jwt.secret=${GATEKEEPER_JWT_SECRET}

# Billing month zone - MUST be identical in gateway and api-management-service
gatekeeper.billing.zone=${GATEKEEPER_BILLING_ZONE:UTC}

# How often the gateway re-reads routes + usage snapshot from management
gateway.config.refresh-interval-ms=${GATEKEEPER_CONFIG_REFRESH_MS:60000}